<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billy² · Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .nav-link {
      transition: opacity 0.2s ease;
    }
    .nav-link:hover {
      opacity: 0.75;
      text-decoration: underline;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-white text-black dark:bg-[#0d0f12] dark:text-white transition-colors duration-200 antialiased">
  
  <!-- Header / Top Bar -->
  <header class="w-full bg-black text-white px-4 sm:px-8 py-2.5 flex flex-row justify-between items-center border-b border-zinc-800 shrink-0 select-none sticky top-0 z-50">
    <a href="https://nottheogbilly.qzz.io/" class="text-2xl sm:text-3xl font-black tracking-tight text-white hover:opacity-90 transition-opacity flex items-center">
      Billy<sup class="text-base sm:text-lg font-bold ml-0.5">2</sup>
    </a>
    <div class="flex items-center space-x-3 sm:space-x-4">
      <nav class="flex items-center space-x-2 sm:space-x-3 text-lg sm:text-xl font-normal text-white">
        <a href="https://github.com/nottheogbilly" target="_blank" rel="noopener noreferrer" class="nav-link">Github</a>
        <span class="text-zinc-500 select-none">·</span>
        <a href="https://nottheogbilly.qzz.io/files" class="nav-link">Files</a>
        <span class="text-zinc-500 select-none">·</span>
        <a href="https://nottheogbilly.qzz.io/socials" class="nav-link">Socials</a>
        <span class="text-zinc-500 select-none">·</span>
        <a href="https://nottheogbilly.qzz.io/projects" class="text-black dark:text-white font-bold underline">Projects</a>
      </nav>

      <!-- Theme Toggle Button -->
      <button id="theme-toggle" type="button" aria-label="Toggle Theme" class="p-1.5 rounded-lg text-gray-300 hover:text-white hover:bg-zinc-800 focus:outline-none transition-colors">
        <svg id="theme-toggle-light-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
        </svg>
        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-[1700px] mx-auto flex-grow px-8 sm:px-16 py-10 sm:py-14">
    <div class="flex flex-row justify-between items-center mb-8 pb-4 border-b border-gray-200 dark:border-zinc-800">
      <h1 class="text-4xl sm:text-5xl font-black tracking-tight text-black dark:text-white">Projects</h1>
      <button id="refresh-api" aria-label="Refresh" class="p-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      </button>
    </div>

    <!-- Apps Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="apps-container">
      <div class="col-span-full py-16 text-center text-gray-400">
        <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
        Loading projects...
      </div>
    </div>
  </main>

  <!-- Details Modal -->
  <div id="app-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#161922] border border-gray-200 dark:border-zinc-800 rounded-2xl max-w-2xl w-full p-6 sm:p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white p-2 rounded-lg hover:bg-zinc-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    // Theme toggle setup
    const themeToggleBtn = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const lightIcon = document.getElementById('theme-toggle-light-icon');

    const savedTheme = localStorage.getItem('color-theme');
    const isDark = savedTheme === 'dark' || (!savedTheme);

    if (isDark) {
      document.documentElement.classList.add('dark');
      lightIcon.classList.remove('hidden');
      darkIcon.classList.add('hidden');
    } else {
      document.documentElement.classList.remove('dark');
      darkIcon.classList.remove('hidden');
      lightIcon.classList.add('hidden');
    }

    themeToggleBtn.addEventListener('click', function() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('color-theme', 'light');
        lightIcon.classList.add('hidden');
        darkIcon.classList.remove('hidden');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('color-theme', 'dark');
        darkIcon.classList.add('hidden');
        lightIcon.classList.remove('hidden');
      }
    });

    const API_BASE = 'https://ogbloxnot.qzz.io';

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function fixUrl(url) {
      if (!url) return '#';
      return url.replace('ogbloxnot.qzz.io//', 'ogbloxnot.qzz.io/');
    }

    // 1. Fetch apps list from /api/list_apps and filter by author "billy"
    async function loadApps() {
      const container = document.getElementById('apps-container');
      container.innerHTML = `
        <div class="col-span-full py-16 text-center text-gray-400">
          <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
          Loading projects...
        </div>
      `;

      try {
        const res = await fetch(`${API_BASE}/api/list_apps`);
        if (!res.ok) throw new Error('Failed to fetch apps');
        const data = await res.json();
        
        const rawApps = (data && data.status === 'success' && Array.isArray(data.apps)) ? data.apps : [];

        // Filter for author === "billy" (case-insensitive)
        const apps = rawApps.filter(app => {
          const author = (app.author || '').toLowerCase();
          return author === 'billy';
        });

        if (apps.length === 0) {
          container.innerHTML = `<div class="col-span-full py-12 text-center text-gray-400">No projects found by billy.</div>`;
          return;
        }

        container.innerHTML = '';
        apps.forEach(app => {
          const name = app.name || app.slug || 'Unknown App';
          const slug = app.slug || '';
          const genre = app.genre || 'Game';
          const author = app.author || '';
          const createdAt = app.created_at ? new Date(app.created_at).toLocaleDateString() : '';

          const card = document.createElement('div');
          card.className = 'p-6 rounded-xl bg-gray-50 dark:bg-[#12141a] border border-black/10 dark:border-white/10 hover:border-blue-500/50 transition-all flex flex-col justify-between shadow-sm';
          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between mb-3">
                <h3 class="text-2xl font-extrabold text-black dark:text-white">${name}</h3>
                <span class="text-xs font-mono px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-500 font-semibold">${genre}</span>
              </div>
              <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 font-mono mb-6">
                ${author ? `<span>By: ${author}</span>` : ''}
                ${createdAt ? `<span>Created: ${createdAt}</span>` : ''}
              </div>
            </div>
            <button onclick="openAppDetails('${slug}')" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition-colors text-center shadow">
              View Releases
            </button>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-red-500 bg-red-500/10 rounded-xl border border-red-500/20 p-6">
            <h3 class="font-bold text-lg mb-1">API Connection Error</h3>
            <p class="text-sm text-gray-400">Could not connect to ${API_BASE}/api/list_apps.</p>
          </div>
        `;
      }
    }

    // 2. Fetch details from /api/get_app?name=slug
    window.openAppDetails = async function(slug) {
      const modal = document.getElementById('app-modal');
      const content = document.getElementById('modal-content');
      modal.classList.remove('hidden');

      content.innerHTML = `
        <div class="py-12 text-center text-gray-400">
          <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
          Loading details for ${slug}...
        </div>
      `;

      try {
        const res = await fetch(`${API_BASE}/api/get_app?name=${encodeURIComponent(slug)}`);
        if (!res.ok) throw new Error('Failed to fetch app');
        const data = await res.json();

        if (data.status !== 'success' || !data.app) throw new Error('App not found');

        const app = data.app;
        const releases = app.releases || [];

        let releasesHtml = '';
        releases.forEach(rel => {
          let buildsHtml = '';
          (rel.builds || []).forEach(b => {
            buildsHtml += `
              <a href="${fixUrl(b.download_url)}" target="_blank" class="flex items-center justify-between p-3 rounded-lg bg-gray-100 dark:bg-zinc-800/80 hover:bg-blue-600 hover:text-white transition-colors group border border-black/5 dark:border-white/5">
                <span class="text-sm font-semibold">${b.pretty_name || b.platform_slug}</span>
                <span class="text-xs font-mono opacity-70">${formatBytes(b.file_size)}</span>
              </a>
            `;
          });

          releasesHtml += `
            <div class="mb-6 p-4 rounded-xl bg-gray-50 dark:bg-[#12141a] border border-black/10 dark:border-white/10">
              <div class="flex items-center justify-between mb-1">
                <h4 class="text-base font-bold text-black dark:text-white">${rel.title || ('v' + rel.version)}</h4>
                <span class="text-xs font-mono text-gray-400">${rel.published_at || ''}</span>
              </div>
              <p class="text-xs font-mono text-blue-500 mb-2">Version ${rel.version}</p>
              <pre class="text-xs text-gray-600 dark:text-gray-300 font-sans whitespace-pre-wrap mb-4 bg-white dark:bg-zinc-900/60 p-3 rounded-lg border border-black/5 dark:border-white/5">${rel.changelog || ''}</pre>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${buildsHtml}</div>
            </div>
          `;
        });

        content.innerHTML = `
          <div class="mb-6">
            <span class="text-xs font-mono px-2 py-0.5 rounded bg-blue-500/10 text-blue-500 font-bold">${app.genre || 'Game'}</span>
            <h2 class="text-3xl font-black text-black dark:text-white mt-1">${app.name}</h2>
          </div>

          <div>
            <h3 class="text-sm font-bold uppercase tracking-wider text-black dark:text-white mb-3">All Releases</h3>
            ${releasesHtml}
          </div>
        `;

      } catch (err) {
        content.innerHTML = `<p class="text-center text-red-500 py-8 font-bold">Failed to load app details.</p>`;
      }
    };

    window.closeModal = function() {
      document.getElementById('app-modal').classList.add('hidden');
    };

    document.getElementById('refresh-api').addEventListener('click', loadApps);

    loadApps();
  </script>
</body>
</html>
