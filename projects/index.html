<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billy² · Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .nav-link { transition: opacity 0.2s ease; }
    .nav-link:hover { opacity: 0.75; text-decoration: underline; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-white text-black dark:bg-[#0d0f12] dark:text-white transition-colors duration-200 antialiased">
  <header class="w-full bg-black text-white px-4 sm:px-8 py-2.5 flex flex-row justify-between items-center border-b border-zinc-800 shrink-0 select-none sticky top-0 z-50">
    <a href="https://nottheogbilly.qzz.io/" class="text-2xl sm:text-3xl font-black tracking-tight text-white hover:opacity-90 transition-opacity flex items-center">
      Billy<sup class="text-base sm:text-lg font-bold ml-0.5">2</sup>
    </a>
    <div class="flex items-center space-x-3 sm:space-x-4">
      <nav class="flex items-center space-x-2 sm:space-x-3 text-lg sm:text-xl font-normal text-white">
        <a href="https://github.com/nottheogbilly" target="_blank" rel="noopener noreferrer" class="nav-link">Github</a>
        <span class="text-zinc-500 select-none">·</span>
        <a href="https://nottheogbilly.qzz.io/files" class="nav-link">Files</a>
        <span class="text-zinc-500 select-none">·</span>
        <a href="https://nottheogbilly.qzz.io/socials" class="nav-link">Socials</a>
        <span class="text-zinc-500 select-none">·</span>
        <a href="https://nottheogbilly.qzz.io/projects" class="nav-link font-semibold underline">Projects</a>
      </nav>
      <button id="theme-toggle" type="button" aria-label="Toggle Theme" class="p-1.5 rounded-lg text-gray-300 hover:text-white hover:bg-zinc-800 focus:outline-none transition-colors">
        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z"/></svg>
        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
      </button>
    </div>
  </header>
  <main class="w-full max-w-7xl mx-auto flex-grow px-4 sm:px-8 pt-8 sm:pt-12 pb-16">
    <section class="mb-8 sm:mb-10">
      <h1 class="text-4xl sm:text-5xl font-black tracking-tight mb-3">Projects</h1>
      <p class="max-w-2xl text-base sm:text-lg text-gray-600 dark:text-gray-400 leading-relaxed">Apps and projects from Billy².</p>
    </section>
    <section aria-label="Projects" class="space-y-5">
      <div id="projects-status" role="status" class="hidden rounded-xl border border-black/10 dark:border-white/10 bg-gray-50 dark:bg-[#12141a] px-5 py-4 text-sm text-gray-600 dark:text-gray-400"></div>
      <div id="projects-list" class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-5">
        <article class="p-5 sm:p-6 rounded-xl bg-gray-50 dark:bg-[#12141a] border border-black/10 dark:border-white/10 shadow-sm">
          <div class="flex items-center justify-between gap-3 mb-4">
            <span class="text-xs font-extrabold uppercase tracking-wider text-blue-500">Game</span>
            <span class="text-xs text-gray-500 dark:text-gray-400">Windows · Linux · Android</span>
          </div>
          <h2 class="text-2xl font-extrabold tracking-tight mb-2">PXLGrid</h2>
          <p class="text-sm leading-relaxed text-gray-600 dark:text-gray-400 mb-5">PXLGrid is a video game made by Billy.</p>
          <div class="border-t border-black/10 dark:border-white/10 pt-4">
            <h3 class="font-bold mb-3">Downloads · version 1.0</h3>
            <div class="flex flex-wrap gap-2">
              <a class="inline-flex items-center rounded-lg bg-blue-600 hover:bg-blue-700 px-4 py-2 text-sm font-semibold text-white transition-colors" href="https://ogbloxnot.qzz.io/?download=da9669d1737712579a7f79958b53d34b93db720507d63987.zip">Windows</a>
              <a class="inline-flex items-center rounded-lg bg-blue-600 hover:bg-blue-700 px-4 py-2 text-sm font-semibold text-white transition-colors" href="https://ogbloxnot.qzz.io/?download=2111a97c5bef037c4ee93c08b5b9b4583b3f34d8181b2c67.gz">Linux</a>
              <a class="inline-flex items-center rounded-lg bg-blue-600 hover:bg-blue-700 px-4 py-2 text-sm font-semibold text-white transition-colors" href="https://ogbloxnot.qzz.io/?download=1baf12f497f69656a179e38be9b85e5a0419bdf56977e508.apk">Android 32-bit</a>
              <a class="inline-flex items-center rounded-lg bg-blue-600 hover:bg-blue-700 px-4 py-2 text-sm font-semibold text-white transition-colors" href="https://ogbloxnot.qzz.io/?download=bce1bd8813d4d0d753ff9f50a808ed337328936ad61cc507.apk">Android 64-bit</a>
            </div>
          </div>
        </article>
      </div>
    </section></main>
  <script>
    const projectStatus = document.getElementById('projects-status');
    const projectsList = document.getElementById('projects-list');
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, function(char) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
      });
    }
    async function loadProjects() {
      try {
        const response = await fetch('https://ogbloxnot.qzz.io/api/list_apps', {headers:{Accept:'application/json'}});
        if (!response.ok) throw new Error();
        const result = await response.json();
        if (!result.success || !Array.isArray(result.applications)) throw new Error();
        const apps = result.applications;
        const details = await Promise.all(apps.map(async function(app) {
          const response = await fetch('https://ogbloxnot.qzz.io/api/get_app?name=' + encodeURIComponent(app.name), {headers:{Accept:'application/json'}});
          if (!response.ok) throw new Error();
          return response.json();
        }));
        projectsList.innerHTML = apps.map(function(app, index) {
          const detail = details[index];
          const info = detail.application || app;
          const releases = Array.isArray(detail.releases) ? detail.releases : [];
          const platforms = Array.isArray(info.platforms) ? info.platforms : [];
          return '<article class="p-5 sm:p-6 rounded-xl bg-gray-50 dark:bg-[#12141a] border border-black/10 dark:border-white/10 shadow-sm"><div class="flex items-center justify-between gap-3 mb-4"><span class="text-xs font-extrabold uppercase tracking-wider text-blue-500">Project</span><span class="text-xs text-gray-500 dark:text-gray-400">' + platforms.map(escapeHtml).join(' · ') + '</span></div><h2 class="text-2xl font-extrabold tracking-tight mb-2">' + escapeHtml(info.name) + '</h2><p class="text-sm leading-relaxed text-gray-600 dark:text-gray-400 mb-5">' + escapeHtml(info.description || '') + '</p><div class="border-t border-black/10 dark:border-white/10 pt-4"><h3 class="font-bold mb-3">Downloads</h3><div class="flex flex-wrap gap-2">' + releases.map(function(release) {
            const href = release.download && release.download.url;
            const label = (release.platform || 'Download') + (release.version ? ' · ' + release.version : '');
            return href ? '<a class="inline-flex items-center rounded-lg bg-blue-600 hover:bg-blue-700 px-4 py-2 text-sm font-semibold text-white transition-colors" href="' + escapeHtml(href) + '">' + escapeHtml(label) + '</a>' : '';
          }).join('') + '</div></div></article>';
        }).join('');
      } catch (error) {
        projectStatus.textContent = 'Showing the latest published PXLGrid details. Live API refresh is blocked until CORS is enabled for this website.';
        projectStatus.classList.remove('hidden');
      }
    }
    loadProjects();

    const themeToggleBtn = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const lightIcon = document.getElementById('theme-toggle-light-icon');
    const savedTheme = localStorage.getItem('color-theme');
    const isDark = savedTheme === 'dark' || (!savedTheme && true);
    if (isDark) { document.documentElement.classList.add('dark'); lightIcon.classList.remove('hidden'); }
    else { document.documentElement.classList.remove('dark'); darkIcon.classList.remove('hidden'); }
    themeToggleBtn.addEventListener('click', function() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark'); localStorage.setItem('color-theme', 'light');
        lightIcon.classList.add('hidden'); darkIcon.classList.remove('hidden');
      } else {
        document.documentElement.classList.add('dark'); localStorage.setItem('color-theme', 'dark');
        darkIcon.classList.add('hidden'); lightIcon.classList.remove('hidden');
      }
    });
  </script></body>
</html>
