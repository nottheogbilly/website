<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billy² · Files</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .nav-link {
      transition: opacity 0.2s ease;
    }
    .nav-link:hover {
      opacity: 0.75;
      text-decoration: underline;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-white text-black dark:bg-[#0d0f12] dark:text-white transition-colors duration-200 antialiased">
  <header class="w-full bg-black text-white px-4 sm:px-8 py-2.5 flex flex-row justify-between items-center border-b border-zinc-800 shrink-0 select-none">
    <a href="https://nottheogbilly.qzz.io/" class="text-2xl sm:text-3xl font-black tracking-tight text-white hover:opacity-90 transition-opacity flex items-center">
      Billy<sup class="text-base sm:text-lg font-bold ml-0.5">2</sup>
    </a>
    <div class="flex items-center space-x-3 sm:space-x-5">
      <nav class="flex items-center space-x-2 sm:space-x-3 text-lg sm:text-xl font-normal text-white">
        <a href="https://github.com/nottheogbilly" target="_blank" rel="noopener noreferrer" class="nav-link">Github</a>
        <span class="text-zinc-500 select-none">·</span>
        <a href="https://nottheogbilly.qzz.io/files" class="nav-link font-semibold underline">Files</a>
        <span class="text-zinc-500 select-none">·</span>
        <a href="https://nottheogbilly.qzz.io/socials" class="nav-link">Socials</a>
      </nav>
      <button id="theme-toggle" type="button" aria-label="Toggle Theme" class="p-1.5 rounded-lg text-gray-300 hover:text-white hover:bg-zinc-800 focus:outline-none transition-colors">
        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
        </svg>
        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
      </button>
    </div>
  </header>
  <main class="w-full max-w-7xl mx-auto flex-grow px-4 sm:px-8 pt-8 pb-16">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
      <nav id="breadcrumbs" class="flex items-center flex-wrap gap-1.5 text-base sm:text-lg text-gray-600 dark:text-gray-400">
      </nav>
      <div class="relative w-full sm:w-72">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search items..." 
          class="w-full pl-9 pr-4 py-2 text-sm rounded-xl bg-gray-100 dark:bg-[#12141a] border border-black/10 dark:border-white/10 text-black dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
        />
      </div>
    </div>
    <div id="file-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      <!-- Cards rendered here -->
    </div>
    <div id="empty-state" class="hidden text-center py-16 text-gray-500 dark:text-gray-400">
      <svg class="mx-auto h-12 w-12 stroke-current opacity-40 mb-3" fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
      </svg>
      <p class="text-lg font-medium">No files or folders found</p>
    </div>
    <div id="loading-state" class="flex flex-col items-center justify-center py-20 text-gray-500 dark:text-gray-400">
      <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-sm font-medium">Loading repository contents...</p>
    </div>

  </main>

  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const lightIcon = document.getElementById('theme-toggle-light-icon');

    const savedTheme = localStorage.getItem('color-theme');
    const isDark = savedTheme === 'dark' || (!savedTheme && true);

    if (isDark) {
      document.documentElement.classList.add('dark');
      lightIcon.classList.remove('hidden');
    } else {
      document.documentElement.classList.remove('dark');
      darkIcon.classList.remove('hidden');
    }

    themeToggleBtn.addEventListener('click', function() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('color-theme', 'light');
        lightIcon.classList.add('hidden');
        darkIcon.classList.remove('hidden');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('color-theme', 'dark');
        darkIcon.classList.add('hidden');
        lightIcon.classList.remove('hidden');
      }
    });

    const REPO_OWNER = 'nottheogbilly';
    const REPO_NAME = 'website-files';
    let currentPath = ''; // Root by default
    let currentItems = [];

    const fileGrid = document.getElementById('file-grid');
    const breadcrumbsNav = document.getElementById('breadcrumbs');
    const searchInput = document.getElementById('search-input');
    const emptyState = document.getElementById('empty-state');
    const loadingState = document.getElementById('loading-state');

    // SVG Icons Helper
    function getIcon(type, name) {
      if (type === 'dir') {
        return `<svg class="w-6 h-6 text-amber-500 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>`;
      }
      const ext = name.split('.').pop().toLowerCase();
      if (['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'].includes(ext)) {
        return `<svg class="w-6 h-6 text-purple-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>`;
      }
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) {
        return `<svg class="w-6 h-6 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>`;
      }
      return `<svg class="w-6 h-6 text-blue-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>`;
    }

    // Fetch Content from GitHub API
    async function loadDirectory(path = '') {
      currentPath = path;
      loadingState.classList.remove('hidden');
      fileGrid.classList.add('hidden');
      emptyState.classList.add('hidden');
      renderBreadcrumbs();

      const apiEndpoint = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;

      try {
        const response = await fetch(apiEndpoint);
        if (!response.ok) throw new Error('Failed to fetch directory');
        const data = await response.json();
        
        // Sort: Folders ('dir') FIRST, then Files ('file') alphabetically
        currentItems = Array.isArray(data) ? data.sort((a, b) => {
          if (a.type === b.type) return a.name.localeCompare(b.name);
          return a.type === 'dir' ? -1 : 1;
        }) : [];

        renderGrid(currentItems);
      } catch (err) {
        console.error(err);
        currentItems = [];
        renderGrid([]);
      } finally {
        loadingState.classList.add('hidden');
        fileGrid.classList.remove('hidden');
      }
    }

    // Render 3-Column Cards
    function renderGrid(items) {
      fileGrid.innerHTML = '';
      const filter = searchInput.value.toLowerCase().trim();
      const filtered = items.filter(item => item.name.toLowerCase().includes(filter));

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      filtered.forEach(item => {
        const card = document.createElement('a');
        card.className = "flex items-center justify-between p-4 rounded-xl bg-gray-100 hover:bg-gray-200 dark:bg-[#12141a] dark:hover:bg-[#1f232d] border border-black/10 dark:border-white/10 text-black dark:text-white transition-all duration-150 shadow-sm hover:shadow cursor-pointer group";

        if (item.type === 'dir') {
          // Folder Click -> Navigate deeper
          card.onclick = (e) => {
            e.preventDefault();
            searchInput.value = '';
            loadDirectory(item.path);
          };
        } else {
          // File Click -> Direct Download / Raw Link
          card.href = item.download_url || `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${item.path}`;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
        }

        card.innerHTML = `
          <div class="flex items-center gap-3 min-w-0 pr-2">
            ${getIcon(item.type, item.name)}
            <span class="font-semibold text-base sm:text-lg truncate tracking-tight text-black dark:text-white">
              ${item.name}
            </span>
          </div>
          <div class="shrink-0 text-gray-400 group-hover:text-black dark:group-hover:text-white transition-colors">
            ${item.type === 'dir' 
              ? `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>`
              : `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>`
            }
          </div>
        `;

        fileGrid.appendChild(card);
      });
    }

    // Render Breadcrumb Path with BOLD for Current Location
    function renderBreadcrumbs() {
      breadcrumbsNav.innerHTML = '';
      
      const segments = currentPath ? currentPath.split('/').filter(Boolean) : [];
      
      // Root Link: displays "/"
      const rootBtn = document.createElement('button');
      rootBtn.type = 'button';
      rootBtn.textContent = '/';
      if (segments.length === 0) {
        rootBtn.className = 'font-bold text-black dark:text-white text-lg';
      } else {
        rootBtn.className = 'hover:underline text-gray-500 dark:text-gray-400 text-lg';
        rootBtn.onclick = () => loadDirectory('');
      }
      breadcrumbsNav.appendChild(rootBtn);

      // Path Segments
      let accumulatedPath = '';
      segments.forEach((seg, idx) => {
        accumulatedPath += (accumulatedPath ? '/' : '') + seg;
        const targetPath = accumulatedPath;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = seg;

        if (idx === segments.length - 1) {
          // Current Active Location is BOLD
          btn.className = 'font-bold text-black dark:text-white text-lg';
        } else {
          btn.className = 'hover:underline text-gray-500 dark:text-gray-400 text-lg';
          btn.onclick = () => loadDirectory(targetPath);
        }
        
        breadcrumbsNav.appendChild(btn);

        // Add trailing separator if not the last item
        if (idx < segments.length - 1) {
          const sep = document.createElement('span');
          sep.className = 'text-gray-400 select-none mx-0.5';
          sep.textContent = '/';
          breadcrumbsNav.appendChild(sep);
        }
      });
    }

    // Search filter listener
    searchInput.addEventListener('input', () => {
      renderGrid(currentItems);
    });

    // Initial load
    loadDirectory('');
  </script>
</body>
</html>
